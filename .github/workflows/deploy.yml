name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Deploy with Docker Compose
        run: |
          rm -f docker-compose.override.yml
          docker compose -f docker-compose.yml up -d --build
          docker image prune -f
